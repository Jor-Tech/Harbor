name: Desktop previews

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
          - name: Windows x64
            runner: windows-2022
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            artifact: macos-x64
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Backend, agent MFA, SFTP and vault compatibility tests
        run: npm test
      - name: Real OpenSSH and tmux persistence
        if: runner.os == 'Linux'
        run: npm run test:tmux
      - name: Windows installer destination checks
        if: runner.os == 'Windows'
        run: node scripts/check-windows-installer.cjs
      - name: Build renderer and native Electron dependencies
        run: |
          npm run build
          npx --no-install electron-builder install-app-deps
      - name: Desktop workflow tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:desktop
          else
            npm run test:desktop
          fi
      - name: Package previews without publisher signing
        run: npm run dist:preview
      - name: Validate Linux launcher and installed icons
        if: runner.os == 'Linux'
        run: node scripts/check-linux-package.cjs
      - name: Packaged desktop workflow tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:packaged
          else
            npm run test:packaged
          fi
      - name: Checksums and build identity
        run: node scripts/preview-manifest.cjs
      - name: Linux installed-app upgrade and vault preservation
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a node scripts/check-linux-upgrade.cjs
      - name: Upload validated preview installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Harbor-preview-${{ matrix.artifact }}-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: |
            preview/*.exe
            preview/*.dmg
            preview/*.zip
            preview/*.AppImage
            preview/*.deb
            preview/SHA256SUMS.txt
            preview/BUILD.json

  release-validation:
    name: Complete release assets
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Harbor-preview-*-${{ github.sha }}
          path: release-input
      - name: Validate the complete release without publishing
        run: GITHUB_REF_NAME="v$(node -p "require('./package.json').version")" node scripts/release.cjs prepare
