name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Backend, agent MFA, SFTP and vault compatibility tests
        run: npm test
      - name: Build renderer and native Electron dependencies
        run: |
          npm run build
          npx --no-install electron-builder install-app-deps
      - name: Source desktop workflow tests
        run: xvfb-run -a npm run test:desktop
