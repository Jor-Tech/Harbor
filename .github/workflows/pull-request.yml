name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Backend, agent MFA, SFTP and vault compatibility tests
        run: npm test
      - name: Build renderer and native Electron dependencies
        run: |
          npm run build
          npx --no-install electron-builder install-app-deps
      - name: Source desktop workflow tests
        run: xvfb-run -a npm run test:desktop
